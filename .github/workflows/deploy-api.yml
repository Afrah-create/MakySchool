name: Deploy MakySchool API

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          pip install -r apps/api/requirements.txt

      - name: Lint with flake8
        run: |
          flake8 apps/api/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Runtime startup check
        env:
          DATABASE_URL: "postgresql://user:password@localhost:5432/makyschool"
          AUTH_JWT_SECRET: "dummy-secret-for-ci"
          PYTHONPATH: "apps/api"
        run: |
          mkdir -p /tmp/isolated-validation
          cp -r apps/api/* /tmp/isolated-validation/
          cd /tmp/isolated-validation
          python -c "from main import app; print('App imported successfully')"

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Copy API files to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          source: "apps/api/"
          target: "/root/makyschool-api"
          strip_components: 2

      - name: Deploy on VPS
        uses: appleboy/ssh-action@master
        env:
          APP_ENV_FILE: ${{ secrets.ENV_FILE }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          envs: APP_ENV_FILE
          script: |
            set -e
            PROJECT_DIR="/root/makyschool-api"
            cd $PROJECT_DIR

            echo "$APP_ENV_FILE" > .env

            # Docker
            if ! command -v docker &> /dev/null; then
              curl -fsSL https://get.docker.com | sh
            fi

            if docker compose version >/dev/null 2>&1; then
              COMPOSE_CMD="docker compose"
            elif command -v docker-compose >/dev/null 2>&1; then
              COMPOSE_CMD="docker-compose"
            else
              curl -L "https://github.com/docker/compose/releases/download/v2.23.0/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
              chmod +x /usr/local/bin/docker-compose
              COMPOSE_CMD="docker-compose"
            fi

            $COMPOSE_CMD down || true
            $COMPOSE_CMD up -d --build

            # ── Reverse proxy (shared VPS) ──────────────────────────────────
            # Other APIs already own :443. We only drop a site fragment and soft-
            # reload. Never start/unmask systemd caddy when :443 is busy.
            mkdir -p /etc/caddy/conf.d
            printf '%s\n' \
              'school-api.makylegacy.com {' \
              '  reverse_proxy localhost:4000' \
              '}' \
              > /etc/caddy/conf.d/makyschool-api.caddy
            echo "Wrote /etc/caddy/conf.d/makyschool-api.caddy"

            port_443_busy=false
            if command -v ss >/dev/null 2>&1 && ss -tln | grep -qE ':443\b'; then
              port_443_busy=true
            elif command -v netstat >/dev/null 2>&1 && netstat -tln | grep -qE ':443\b'; then
              port_443_busy=true
            fi

            if [ "$port_443_busy" = true ]; then
              echo "Port 443 already in use — will not start a second Caddy"

              # Append conf.d import only; never overwrite the shared Caddyfile.
              if [ -f /etc/caddy/Caddyfile ] && ! grep -qE 'conf\.d/\*\.caddy' /etc/caddy/Caddyfile; then
                printf '\n# MakySchool API\nimport /etc/caddy/conf.d/*.caddy\n' >> /etc/caddy/Caddyfile
                echo "Appended conf.d import to existing Caddyfile"
              fi

              # Soft reload via admin API — does not re-bind :443.
              if command -v caddy >/dev/null 2>&1 \
                && [ -f /etc/caddy/Caddyfile ] \
                && caddy validate --config /etc/caddy/Caddyfile \
                && caddy reload --config /etc/caddy/Caddyfile; then
                echo "Existing Caddy reloaded with MakySchool site"
              else
                echo "WARNING: automatic reload failed or skipped."
                echo "Site fragment is at /etc/caddy/conf.d/makyschool-api.caddy"
                echo "Reload the process that owns :443 manually."
                echo "Do NOT run: systemctl start caddy"
                ss -tlnp 2>/dev/null | grep -E ':443\b' || true
              fi

              # Keep systemd unit from fighting for :443 (other API's proxy).
              systemctl stop caddy 2>/dev/null || true
              systemctl mask caddy 2>/dev/null || true
              echo "systemd caddy.service left masked"
            else
              echo "Port 443 free — configuring systemd caddy for this host only"
              if ! command -v caddy >/dev/null 2>&1; then
                apt-get install -y debian-keyring debian-archive-keyring apt-transport-https curl
                curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/gpg.key' | gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
                curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt' | tee /etc/apt/sources.list.d/caddy-stable.list
                apt-get update && apt-get install -y caddy
              fi
              if command -v ufw >/dev/null 2>&1; then
                ufw allow 80/tcp || true
                ufw allow 443/tcp || true
              fi
              if [ ! -f /etc/caddy/Caddyfile ]; then
                printf '%s\n' '{' '  email admin@makylegacy.com' '}' '' 'import /etc/caddy/conf.d/*.caddy' > /etc/caddy/Caddyfile
              elif ! grep -qE 'conf\.d/\*\.caddy' /etc/caddy/Caddyfile; then
                printf '\nimport /etc/caddy/conf.d/*.caddy\n' >> /etc/caddy/Caddyfile
              fi
              caddy validate --config /etc/caddy/Caddyfile
              if systemctl is-enabled caddy 2>&1 | grep -qi masked; then
                systemctl unmask caddy
              fi
              systemctl daemon-reload || true
              systemctl enable caddy || true
              systemctl reload caddy 2>/dev/null || systemctl restart caddy || systemctl start caddy
              sleep 3
              systemctl is-active --quiet caddy || {
                journalctl -u caddy --no-pager -n 50
                exit 1
              }
              echo "Caddy running"
            fi

            # Health check (API container — independent of proxy)
            sleep 10
            if docker ps | grep -q makyschool-api; then
              echo "Container is running"
              curl -sf http://localhost:4000/api/v1/ || echo "API warming up"
            else
              echo "Container failed to start"
              docker logs makyschool-api --tail=80
              $COMPOSE_CMD logs --tail=80
              exit 1
            fi

            docker logs makyschool-api --tail=40
